<!doctype html>
<html>
<head><meta charset="utf-8"><title>My Account - Acme</title></head>
<body>
<nav><a href="/jobs/">Jobs</a> <a href="/account/login.php">Login</a></nav>
<!-- The sign-up, at /account/ -->
<form id="apply" action="/account/" method="post">
  <input type="hidden" name="csrf_token" value="token-1">
  <input type="text" name="first_name" id="first_name" class="form-control required">
  <input type="text" name="last_name" id="last_name" class="form-control required">
  <input type="email" name="email" id="email" class="form-control required">
  <input type="email" name="email_pls" id="email_pls" tabindex="-1" style="position:absolute; opacity:0;">
  <input type="email" name="email_confirm" id="email_confirm" class="form-control required">
  <input type="text" name="contact_number" id="contact_number" class="form-control required" maxlength="16">
  <select name="contact_number_type" id="contact_number_type" class="form-control required">
    <option value="2">Cell*</option><option value="1">Home</option><option value="3">Work</option>
  </select>
  <input type="text" name="street1" id="street1" class="form-control required">
  <input type="text" name="street2" id="street2" class="form-control">
  <select name="country_id" id="country_id" class="form-control required">
    <option value="">Country/Territory*</option><option value="226" selected="selected">United States</option><option value="38">Canada</option>
  </select>
  <select name="state_id" id="state_id" class="form-control required">
    <option value="">State/Province*</option><option value="5">California</option><option value="9">District of Columbia</option>
  </select>
  <input type="text" name="city" id="city" class="form-control required">
  <input type="text" name="zip" id="zip_code" class="form-control required">
  <input type="password" name="password" id="password" class="form-control required">
  <input type="password" name="password_confirm" id="password_confirm" class="form-control required">
  <select name="applicant_consent_approval" id="applicant_consent_approval" class="form-control required">
    <option value=""></option><option value="1">Yes, I agree to be contacted by text messages</option><option value="2">No, I do not agree to receive text messages</option>
  </select>
  <select name="text_approval" id="text_approval" class="form-control">
    <option value="0">Email</option><option value="1" disabled>Text Message</option>
  </select>
  <input type="checkbox" id="info_use_consent" name="info_use_consent">
  <input type="submit" id="submit_apply" value="Create Job Profile">
</form>
<script>
  // a country's states load once it is picked
  const STATES = {"226": [["5", "California"], ["9", "District of Columbia"]],
                  "38": [["52", "Alberta"], ["53", "British Columbia"]]};
  document.getElementById("country_id").addEventListener("change", e => {
    const list = STATES[e.target.value] || [];
    setTimeout(() => {
      document.getElementById("state_id").innerHTML = '<option value="">State/Province*</option>'
        + list.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
    }, 100);
  });
</script>
</body>
</html>
