<template id="eeoc">
<h1>Voluntary Disclosure</h1>
<form class="validate" id="new_eeoc">
  <input type="hidden" name="applications_id" value="5001">
  <ul class="list-group">
    <li class="list-group-item"><h2 class="accent">Sex/Gender</h2></li>
    <li class="list-group-item background-theme">
      <fieldset>
        <legend class="sr-only">Sex/Gender</legend>
        <div class="radio"><label><input type="radio" name="sex_type" class="required" value="m"> Male</label></div>
        <div class="radio"><label><input type="radio" name="sex_type" class="required" value="f"> Female</label></div>
        <div class="radio"><label><input type="radio" name="sex_type" class="required" value="u"> I choose not to provide my gender.</label></div>
      </fieldset>
    </li>
  </ul>
  <ul class="list-group">
    <li class="list-group-item"><h4 class="accent">VETERANS INVITATION TO SELF-IDENTIFY</h4></li>
    <li class="list-group-item background-theme">
      <fieldset>
        <legend class="sr-only">Veterans Classification</legend>
        <div class="radio"><label><input type="radio" class="required" name="is_vet_2014" value="1"> I IDENTIFY AS ONE OR MORE OF THE CLASSIFICATIONS OF PROTECTED VETERANS</label></div>
        <div class="radio"><label><input type="radio" class="required" name="is_vet_2014" value="0"> I AM NOT A PROTECTED VETERAN</label></div>
        <div class="radio"><label><input type="radio" class="required" name="is_vet_2014" value="2"> I DON'T WISH TO ANSWER</label></div>
      </fieldset>
    </li>
  </ul>
  <ul class="list-group">
    <li class="list-group-item"><h4>Voluntary Self-Identification of Disability</h4>
      <input type="text" name="disabled_employee_id" autocomplete="off">
    </li>
    <li class="list-group-item background-theme">
      <select class="form-control required zeroValue" name="is_disabled" id="is_disabled" data-question-title="Disability Classification">
        <option value="0">....</option>
        <option value="1">Yes, I have a disability, or have had one in the past</option>
        <option value="2">No, I do not have a disability and have not had one in the past</option>
        <option value="3">I do not want to answer</option>
      </select>
    </li>
  </ul>
</form>
<div class="application-footer"><button id="previous">Back</button><button id="next">Proceed to Next Step</button></div>
</template>
