<!doctype html>
<meta charset="utf-8">
<meta name="hiring-system" content="fake">
<form onsubmit="event.preventDefault(); history.pushState(null, '', '?sent=1')">
  <input name="name">
  <select name="level"><option></option><option>Native</option><option>Fluent</option></select>
  <label><input type="checkbox" name="langs" value="French"> French</label>
  <label><input type="checkbox" name="langs" value="English"> English</label>
  <input type="file" name="cv">
  <button>Submit</button>
</form>
<p id="echo"></p>
<script>
  // Echoes the name and the file as some systems do: what a snapshot must scrub besides values
  document.forms[0].addEventListener("input", e => {
    const f = e.currentTarget;
    document.getElementById("echo").textContent =
      `Hello ${f.elements.name.value}, ${f.cv.files[0]?.name ?? ""}`;
  });
</script>
