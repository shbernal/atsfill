<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme Careers - Job Submission</title></head>
<body>
<!-- One page of a Taleo job submission wizard, holding one example of each rendering the
     adapter reads; Save and Continue moves to the review page. Job 777 is a fresh draft: its
     first page does not save without a first name, and a second page follows it. -->
<form id="et-ef" action="#" onsubmit="return false">
<a id="et-ef-content-ftf-j_id_id81pc5-1-dtGotoPageLink" href="#">Attachments</a>
<h1 id="step">Personal Information</h1>
<table id="first-page"><tr><td>
  <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_FirstName">Legal First Name<span class="hidden-audible">.&nbsp;Required</span></label>
  <input type="text" id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_FirstName">
</td></tr><tr><td>
  <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_HomePhone">Home Phone Number<span class="hidden-audible">.&nbsp;Required</span></label>
  <input type="text" id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_HomePhone">
</td></tr><tr><td>
  <fieldset><legend>Place of Residence <img class="requiredimg" alt=""></legend>
  <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_ResidenceLocation-0">Country</label>
  <select id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_ResidenceLocation-0" onchange="levels(this.value)">
    <option value="-1000">Not Specified</option><option value="1">Canada</option><option value="2">United States</option>
  </select>
  <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_ResidenceLocation-1">State/Province</label>
  <select id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_ResidenceLocation-1">
    <option value="-1000">Not Specified</option>
  </select>
  </fieldset>
</td></tr><tr><td>
  <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_2-sourceTrackingBlock-recruitmentSourceType">Source Type<span class="hidden-audible">.&nbsp;Required</span></label>
  <select id="et-ef-content-ftf-gp-j_id_id16pc9-page_2-sourceTrackingBlock-recruitmentSourceType">
    <option value="-1">Select One...</option><option value="7">Job Board</option><option value="8">Website</option>
  </select>
</td></tr><tr><td>
  <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_1-cfrm-cfrmsub-frm-dv_cs_basicprofile_AvailabilityDate">Date of Availability</label>
  <a id="et-ef-content-ftf-gp-j_id_id16pc9-page_1-cfrm-cfrmsub-frm-dv_cs_basicprofile_AvailabilityDate.display" href="#">Not Specified</a>
</td></tr><tr><td>
  <input type="checkbox" id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-we-wei-0-frm:dv_cs_experience_CurrentEmployer">
  <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-we-wei-0-frm:dv_cs_experience_CurrentEmployer">Current Job</label>
</td></tr><tr><td>
  <fieldset><legend><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-we-wei-0-frm-dv_cs_experience_BeginDate">Start Date<span class="hidden-audible">.&nbsp;Required</span></label></legend>
  <select id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-we-wei-0-frm-dv_cs_experience_BeginDate.month">
    <option value="-1">Month</option><option value="0">Jan</option><option value="1">Feb</option>
  </select>
  <select id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-we-wei-0-frm-dv_cs_experience_BeginDate.year">
    <option value="-1">Year</option><option value="2021">2021</option><option value="2020">2020</option>
  </select>
  </fieldset>
</td></tr><tr><td class="columnfull"><span class="blockpanel"><span class="questionnaire">
  <fieldset class="fs-508 possibleanswers"><legend><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-preq-j_id_id7pc10-page__1-q-j_id_id2pc11-0-qr"><img class="requiredimg" alt=""><span class="index">1. </span><span class="description">Have you worked for Acme before?</span><span class="hidden-audible">Required</span></label></legend>
    <span class="fs-508-block"><label><input type="radio" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-preq-j_id_id7pc10-page__1-q-j_id_id2pc11-0-qr" id="q0-yes" onclick="explain(true)"> Yes</label></span>
    <span class="fs-508-block"><label><input type="radio" name="et-ef-content-ftf-gp-j_id_id16pc9-page_0-preq-j_id_id7pc10-page__1-q-j_id_id2pc11-0-qr" id="q0-no" onclick="explain(false)"> No</label></span>
  </fieldset>
  <span id="reason" style="display: none">
    <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-preq-reason">Tell us why not</label>
    <input type="text" id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-preq-reason">
  </span>
  <span id="explain" style="display: none">
    <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-preq-j_id_id7pc10-page__1-q-j_id_id2pc11-0-questionExplanationText">If yes, give the dates</label>
    <textarea id="et-ef-content-ftf-gp-j_id_id16pc9-page_0-preq-j_id_id7pc10-page__1-q-j_id_id2pc11-0-questionExplanationText"></textarea>
  </span>
</span></span></td></tr><tr><td class="columnfull"><span class="blockpanel"><span class="questionnaire">
  <fieldset class="fs-508"><legend><label for="et-ef-content-ftf-gp-j_id_id16pc9-page_0-preq-j_id_id7pc10-page__1-q-j_id_id2pc11-1-qr"><span class="description">Which settings have you worked in?</span></label></legend>
    <label class="fs-508-block"><input type="checkbox" id="q1_com.taleo.functionalcomponent.prescreening.entity.question.PossibleAnswer__1"> Office</label>
    <label class="fs-508-block"><input type="checkbox" id="q1_com.taleo.functionalcomponent.prescreening.entity.question.PossibleAnswer__2"> None of the Above</label>
  </fieldset>
</span></span></td></tr></table>
<table id="second-page" style="display: none"><tr><td>
  <label for="et-ef-content-ftf-gp-j_id_id16pc9-page_1-portfolio">Portfolio</label>
  <input type="text" id="et-ef-content-ftf-gp-j_id_id16pc9-page_1-portfolio">
</td></tr></table>
<input type="checkbox" id="et-ef-content-ftf-gp-j_id_id16pc9:page_3:sendMeJobs:selectBooleanCheckbox_sendMeJobs">
<input type="button" id="et-ef-content-ftf-saveContinueCmdBottom" value="Save and Continue" onclick="save()">
</form>
<script>
const STATES = {"1": ["Ontario"], "2": ["District of Columbia", "New York"]};
function levels(country) {
  const next = document.getElementById("et-ef-content-ftf-gp-j_id_id16pc9-page_0-cpi-cfrmsub-frm-dv_cs_candidate_personal_info_ResidenceLocation-1");
  setTimeout(() => {
    next.innerHTML = '<option value="-1000">Not Specified</option>' +
      (STATES[country] || []).map((s, i) => `<option value="s${i}">${s}</option>`).join("");
  }, 100);
}
function explain(shown) {
  document.getElementById("explain").style.display = shown ? "" : "none";
  document.getElementById("reason").style.display = shown ? "none" : "";
}
const firstName = document.querySelector("[id$=personal_info_FirstName]");
firstName.value = sessionStorage.getItem("first-name") || "";
function save() {
  const onFirstPage = !!document.getElementById("first-page");
  if (!location.search.includes("job=777") || !onFirstPage) {
    location.href = location.href.replace("jobapply.ftl", "review.ftl");
  } else if (firstName.value) {
    sessionStorage.setItem("first-name", firstName.value);
    document.getElementById("first-page").remove();
    document.getElementById("second-page").style.display = "";
    document.getElementById("step").textContent = "Attachments";
  } else {
    document.querySelector("form").insertAdjacentHTML("afterbegin",
      '<h1>Errors occurred on this page</h1><p class="errorMessage">Enter a first name.</p>');
  }
}
</script>
</body>
</html>
