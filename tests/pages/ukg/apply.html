<!DOCTYPE html>
<!-- A UKG Pro Recruiting application form as the Knockout view renders it: one example of
     each rendering docs/adapters/ukg.md lists, for an Acme tenant. -->
<html>
<head><meta charset="utf-8"><title>Apply</title>
<style>.hidden { display: none; } .day-btn.selected { font-weight: bold; }</style>
</head>
<body>
<div id="OpportunityApply">
  <script>var opportunity = {"Id":"x","IsResumeRequired":true};</script>
  <div data-automation="upload-resume">
    <form action="/acme1000acme/JobBoard/00000000-0000-4000-8000-000000000001/Documents/UploadResume">
      <input type="file" name="file" class="hidden">
    </form>
  </div>
  <div class="apply-form">
    <div class="form-group"><label for="Email">Email</label><span id="Email">ada@example.com</span></div>
    <div class="form-group">
      <label for="Prefix" class="control-label">Title</label>
      <select id="Prefix" data-automation="prefix-dropdown"><option value="">Choose...</option>
        <option value="1">Dr.</option><option value="2">Mr.</option></select>
    </div>
    <div class="form-group">
      <label for="FirstName" class="control-label required">First Name</label>
      <input type="text" readonly class="form-control" id="FirstName" required value="Ada">
    </div>
    <div class="form-group">
      <label for="PreferredName" class="control-label">Preferred Name</label>
      <input type="text" readonly class="form-control" id="PreferredName" placeholder="Preferred">
    </div>
    <div class="form-group">
      <label for="Phone" class="control-label required">Primary Phone</label>
      <input required class="form-control" type="tel" id="Phone" maxlength="25">
    </div>
    <div class="form-group">
      <label for="Country" class="required">Country</label>
      <select id="Country" name="Country"><option value="">Choose...</option>
        <option value="c-ca">Canada</option><option value="c-us">United States</option>
        <option value="c-ky">Cayman Islands</option></select>
    </div>
    <div class="form-group">
      <label for="AddressLine1" class="control-label required">Address 1</label>
      <input class="form-control" type="text" id="AddressLine1" required maxlength="50">
    </div>
    <div class="form-group">
      <label for="City" class="control-label required">City</label>
      <input class="form-control" type="text" id="City" required>
    </div>
    <div class="form-group" id="StateGroup" style="display: none">
      <label for="State" class="control-label required">State / Province</label>
      <select id="State" required><option value="">Choose...</option></select>
    </div>
    <div class="form-group">
      <label for="PostalCode" class="control-label required">Zip / Postal Code</label>
      <input class="form-control" type="text" id="PostalCode" required>
    </div>
    <div class="checkbox"><label>
      <input type="checkbox" id="WillingToRelocate"> <span>Willing to relocate</span></label></div>

    <div class="panel" id="Documents">
      <form action="/acme1000acme/JobBoard/00000000-0000-4000-8000-000000000001/Documents/UploadFile">
        <input type="file" name="file" class="hidden" accept="application/pdf,application/msword">
        <label data-automation="upload-file-btn">Upload a file</label>
      </form>
      <div id="Files"></div>
    </div>

    <div role="group" aria-labelledby="AvailabilityDaysQuestion">
      <label id="AvailabilityDaysQuestion">Which days are you available to work?</label>
      <table><tr>
        <td class="day-btn" data-automation="day-btn">Sun</td>
        <td class="day-btn" data-automation="day-btn">Mon</td>
        <td class="day-btn" data-automation="day-btn">Sat</td>
      </tr></table>
    </div>
    <label for="notes">Notes</label>
    <textarea data-automation="availability-note" id="notes" maxlength="4000"></textarea>

    <div id="Questions">
      <div class="form-group">
        <label for="ApplicantSource" class="control-label required">How did you hear about this opportunity?</label>
        <select id="ApplicantSource" data-automation="applicant-source-dropdown">
          <option value="">Choose...</option><option value="s1">Company Website</option>
          <option value="s2">Indeed</option></select>
      </div>
      <div class="form-group" role="radiogroup" aria-labelledby="EmployeeReferral">
        <label id="EmployeeReferral" class="control-label">Were you referred by a current employee?</label>
        <div class="radio"><label><input type="radio" name="employeereferral" value="true"> <span>Yes</span></label></div>
        <div class="radio"><label><input type="radio" name="employeereferral" value="false"> <span>No</span></label></div>
      </div>
      <div id="ReferralRow" style="display:none">
        <div class="form-group">
          <label for="ReferralName" class="control-label required">Name</label>
          <input type="text" class="form-control" maxlength="100" id="ReferralName" required>
        </div>
        <div class="form-group">
          <label for="ReferralEmail" class="control-label">Email</label>
          <input type="text" class="form-control" maxlength="128" id="ReferralEmail">
        </div>
        <div class="form-group">
          <label for="ReferralPhone" class="control-label">Phone</label>
          <input type="text" class="form-control" maxlength="25" id="ReferralPhone">
        </div>
      </div>
      <div class="form-group">
        <label for="ApplicationAvailableStartDateInput" class="control-label required">When can you start? (MM/DD/YYYY)</label>
        <react-ko-es6-bridge><div data-automation="available-start-date-datepicker">
          <span id="AvailableStartDate" class="sr-only">When can you start?</span>
          <ukg-input required="true" type="date" value="2026-10-25">
            <input data-automation="ukg-date-input-text-month" maxlength="2" value="10">/
            <input data-automation="ukg-date-input-text-day" maxlength="2" value="25">/
            <input data-automation="ukg-date-input-text-year" maxlength="4" value="2026">
          </ukg-input>
        </div></react-ko-es6-bridge>
      </div>
      <div id="ApplicationQuestions">
        <div data-automation="application-knockout-question">
          <div class="form-group" role="group" aria-labelledby="MultipleChoiceQuestion0">
            <label id="MultipleChoiceQuestion0" data-automation="question-title" class="control-label required">Are you 18 years of age or older?</label>
            <div class="radio"><label class="radio"><input type="radio" required name="MultipleChoiceResponse0" value="0"> <span class="radio-text">Yes</span></label></div>
            <div class="radio"><label class="radio"><input type="radio" required name="MultipleChoiceResponse0" value="1"> <span class="radio-text">No</span></label></div>
          </div>
        </div>
        <div data-automation="application-knockout-question">
          <div class="form-group">
            <label for="TextResponse1" data-automation="question-title" class="control-label required">Why Acme?</label>
            <textarea id="TextResponse1" data-automation="text-response" maxlength="4000"></textarea>
          </div>
        </div>
        <div data-automation="application-knockout-question">
          <div class="form-group">
            <label for="NumericResponse2" data-automation="question-title" class="control-label">Years of experience?</label>
            <input type="text" id="NumericResponse2" data-automation="numeric-response">
          </div>
        </div>
      </div>
      <div id="CountryQuestions">
        <div class="form-group">
          <label for="Gender" class="control-label required">Gender</label>
          <select id="Gender" data-automation="country-questions-gender" required>
            <option value="">Choose...</option><option value="Male">Male</option>
            <option value="Female">Female</option></select>
          <div class="checkbox"><label>
            <input type="checkbox" data-automation="gender-decline-checkbox">
            <span>I decline to say</span><span class="sr-only">Gender</span></label></div>
        </div>
        <div class="form-group">
          <label for="HispanicOrigin" class="control-label required">Ethnic Origin</label>
          <select id="HispanicOrigin" data-automation="country-questions-hispanic-origin" required>
            <option value="">Choose...</option><option value="Yes">Hispanic/Latino</option>
            <option value="No">Not Hispanic/Latino</option></select>
          <div class="checkbox"><label>
            <input type="checkbox" data-automation="ethnic-origin-decline-checkbox">
            <span>I decline to say</span><span class="sr-only">Ethnic Origin</span></label></div>
        </div>
        <div class="row collapse" id="RaceRow" style="display: none">
          <div class="form-group">
            <label for="EthnicOrigin" class="control-label required">Race</label>
            <select id="EthnicOrigin" data-automation="country-questions-race" required>
              <option value="">Choose...</option><option value="White">White</option>
              <option value="Asian">Asian</option></select>
            <div class="checkbox"><label>
              <input type="checkbox" data-automation="race-decline-checkbox">
              <span>I decline to say</span><span class="sr-only">Race</span></label></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal"><input type="text" id="InModal"></div>
    <ukg-button data-automation="btn-submit">Submit</ukg-button>
  </div>
</div>
<script>
  const states = {"c-us": [{"Code": "DC", "Name": "District of Columbia"}, {"Code": "NY", "Name": "New York"}],
                  "c-ca": [{"Code": "ON", "Name": "Ontario"}]};
  document.getElementById("Country").addEventListener("change", async e => {
    const select = document.getElementById("State");
    select.length = 1;
    const response = await fetch(`GetStates?countryId=${e.target.value}`);
    for (const s of await response.json()) select.add(new Option(s.Name, s.Code));
    document.getElementById("StateGroup").style.display = select.length > 1 ? "" : "none";
  });
  for (const day of document.querySelectorAll(".day-btn"))
    day.addEventListener("click", () => day.classList.toggle("selected"));
  const upload = document.querySelector("#Documents input[type=file]");
  upload.addEventListener("change", () => {
    const name = upload.files[0].name;
    document.getElementById("Files").innerHTML =
      `<div data-automation="file-name"><input type="checkbox" data-automation="select-document-checkbox" checked><strong class="hidden">File Name</strong>` +
      `<span id="FileName0">${name}</span></div>`;
  });
  // an equal-opportunity question's decline box clears its select when ticked
  for (const box of document.querySelectorAll("[data-automation$='-decline-checkbox']"))
    box.addEventListener("change", () => {
      if (box.checked) box.closest(".form-group").querySelector("select").value = "";
    });
  // race is asked when not Hispanic or Latino
  const hispanic = document.getElementById("HispanicOrigin");
  const race = () => document.getElementById("RaceRow").style.display =
    hispanic.value === "No" ? "" : "none";
  hispanic.addEventListener("change", race);
  document.querySelector("[data-automation=ethnic-origin-decline-checkbox]")
    .addEventListener("change", race);
  // the referrer's details are asked when referred by an employee
  for (const radio of document.querySelectorAll("[name=employeereferral]"))
    radio.addEventListener("change", () => document.getElementById("ReferralRow").style.display =
      radio.checked && radio.value === "true" ? "" : "none");
  // autoNumeric groups a Numeric question's number
  const numeric = document.getElementById("NumericResponse2");
  numeric.addEventListener("blur", () => {
    numeric.value = Number(numeric.value.replace(/,/g, "")).toLocaleString("en-US");
  });
  const picker = document.querySelector("ukg-input");
  for (const part of picker.querySelectorAll("input")) part.addEventListener("input", () => {
    const [m, d, y] = [...picker.querySelectorAll("input")].map(i => i.value);
    picker.setAttribute("value", `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`);
  });
</script>
</body>
</html>
