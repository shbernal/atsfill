<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Career Opportunities: Create an Account</title></head>
<body>
  <div id="error" class="rcmValidationMsgArea displayNone" role="alert"></div>
  <input type="text" id="fbclc_userName" aria-label="Email Address:">
  <input type="text" id="fbclc_emailConf" aria-label="Retype Email Address:">
  <input type="password" id="fbclc_pwd" maxlength="99" aria-label="Choose Password:">
  <input type="password" id="fbclc_pwdConf" aria-label="Retype Password:">
  <input type="text" id="fbclc_fName" aria-label="First Name:">
  <input type="text" id="fbclc_lName" aria-label="Last Name:">
  <select id="fbclc_ituCode" aria-required="true">
    <option value="">- Select -</option><option value="AR">Argentina (+54)</option><option value="BS">Bahamas (+1)</option><option value="CA">Canada (+1)</option><option value="US">United States (+1)</option>
  </select>
  <input type="text" id="fbclc_phoneNumber" aria-required="true">
  <select id="fbclc_country" aria-label="Country/Region of Residence">
    <option value="">No Selection</option><option value="AR">Argentina</option><option value="US">United States</option>
  </select>
  <label id="makeProfileVisibleLabel">Make my Profile visible to:<span class="required">*</span></label>
  <div class="form-group" aria-required="true" role="radiogroup" aria-labelledby="makeProfileVisibleLabel">
    <input type="radio" name="fbclc_searPref" value="1" aria-label="Any recruiter within the company to consider me for positions worldwide">
    <input type="radio" name="fbclc_searPref" value="2" aria-label="Only recruiters managing jobs I apply to">
  </div>
  <input type="checkbox" id="fbclc_emailEnabled">
  <a id="dataPrivacyId" role="button" onclick="document.getElementById('dpcs').style.display = 'block'; return false;">Read and accept the data privacy statement.</a>
  <div id="dpcs" role="dialog" style="display: none">
    <p>Privacy Notice</p>
    <button id="dlgButton_21:" onclick="accepted = true; this.parentElement.style.display = 'none'">Accept</button>
    <button id="dlgButton_22:" onclick="this.parentElement.style.display = 'none'">Decline</button>
  </div>
  <button type="submit" id="fbclc_createAccountButton" onclick="create(); return false;">Create Account</button>
  <script>
    let accepted = false;
    function create() {
      const error = document.getElementById('error');
      const email = document.getElementById('fbclc_userName').value;
      const fields = ['fbclc_emailConf', 'fbclc_pwd', 'fbclc_pwdConf', 'fbclc_fName', 'fbclc_lName', 'fbclc_ituCode', 'fbclc_phoneNumber', 'fbclc_country'];
      const visible = document.querySelector('[name=fbclc_searPref]:checked');
      if (!accepted || !visible || fields.some(id => !document.getElementById(id).value)) {
        error.textContent = 'Please complete all required fields and re-submit.';
      } else if (email.startsWith('otp')) {  // some sites send a passcode before the account
        document.body.innerHTML = '<div id="otpContainer"><p>We have sent a one-time password to your email address.</p>' +
          '<input type="password" name="passcode" id="passcode" aria-required="true"><button id="continueBtn">Continue</button></div>';
        return;
      } else if (email.startsWith('taken')) {
        error.textContent = 'An account with this email address already exists.';
      } else if (document.getElementById('fbclc_pwd').value.length > 18) {
        error.textContent = 'Password must not be longer than 18 characters.';
      } else {
        document.cookie = 'signedIn=1; path=/';
        const sent = ['fbclc_ituCode', 'fbclc_phoneNumber', 'fbclc_country']
          .map(id => `${id}=${encodeURIComponent(document.getElementById(id).value)}`).join('&')
          + `&fbclc_searPref=${visible.value}`;
        // some sites go back to the career site, signed in, instead of to the application
        location.href = email.startsWith('back') ? '/career?company=acme' : `/portalcareer?_s.crb=x&${sent}`;
        return;
      }
      error.classList.remove('displayNone');
    }
  </script>
</body></html>
