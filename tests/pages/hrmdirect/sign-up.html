<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<!-- The apply page's first step on an org that requires the mobile phone: no Optional label
     beside it. Continue opens the wizard's first page, holding what was sent in its
     data-sent. -->
<form id="personal-info-form">
  <div class="form-group"><label>First Name</label><input type="text" class="form-control first-name"></div>
  <div class="form-group"><label>Last Name</label><input type="text" class="form-control last-name"></div>
  <div class="form-group"><label>Email</label><input type="text" class="form-control email"></div>
  <div class="form-group"><label>Confirm Email</label><input type="text" class="form-control email-confirm"></div>
  <div class="form-group">
    <label class="col-sm-3 control-label">Mobile Phone</label>
    <div class="col-sm-9 form-field"><input type="text" class="form-control mobile-number" data-max="80" placeholder="Mobile Phone"></div>
  </div>
  <div class="radio-group">
    <span>Would you like to be considered for other positions?</span>
    <label><input type="radio" name="other" value="true" required> Yes</label>
    <label><input type="radio" name="other" value="false" required> No</label>
  </div>
  <button type="button" class="btn btn-primary submit-button">Continue</button>
</form>
<script>
  document.querySelector("button.submit-button").addEventListener("click", () => {
    const form = document.querySelector("#personal-info-form");
    const sent = {};
    form.querySelectorAll("input[type=text]").forEach(i => { sent[i.className.split(" ").pop()] = i.value; });
    sent.other = form.querySelector("input[name=other]:checked")?.value ?? null;
    form.remove();
    document.body.innerHTML = '<div class="form-page-holder"><form class="section-form"><p>Page 1</p></form></div>';
    document.querySelector("form.section-form").dataset.sent = JSON.stringify(sent);
  });
</script>
</body>
</html>
