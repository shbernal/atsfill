<script>
(() => {
  const h = (tag, attrs = {}, ...children) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    el.append(...children);
    return el;
  };
  const prefix = d => `application_form[application][answers_attributes][${d.index}]`;
  const label = (forId, d) => h("label", {class: "external-form__label", for: forId},
    h("span", {class: "external-form__label--title"}, d.title));

  // A react-select: a control that opens a menu of options, a hidden input with the pick.
  function select(options, {multi = false, name = "selectBox", searchable = false, onPick, initial} = {}) {
    const hidden = h("input", {type: "hidden", name, value: ""});
    const value = h("div", {class: "react-select__value-container"});
    const input = h("input", {class: "react-select__input", role: "combobox", value: ""});
    if (!searchable) input.setAttribute("readonly", "");
    const control = h("div", {class: "react-select__control"}, value, input);
    const box = h("div", {class: "react-select"}, control, hidden);
    let menu = null, picked = [];
    const close = () => { menu?.remove(); menu = null; };
    const open = (filter = "") => {
      close();
      menu = h("div", {class: "react-select__menu"});
      for (const o of options.filter(o => o.label.toLowerCase().startsWith(filter.toLowerCase()))) {
        const option = h("div", {class: "react-select__option"}, o.label);
        option.addEventListener("click", () => {
          picked = multi ? [...picked, o] : [o];
          value.replaceChildren(...picked.map(p => multi
            ? h("div", {class: "react-select__multi-value"},
                h("div", {class: "react-select__multi-value__label"}, p.label))
            : h("div", {class: "react-select__single-value"}, p.label)));
          hidden.value = picked.map(p => p.value).join(",");
          input.value = "";
          if (!multi) close(); else option.remove();
          onPick?.(o);
        });
        menu.append(option);
      }
      box.append(menu);
    };
    if (initial) {  // shown picked before any answer
      picked = [initial];
      value.replaceChildren(h("div", {class: "react-select__single-value"}, initial.label));
      hidden.value = initial.value;
    }
    control.addEventListener("click", () => menu ? close() : open());
    input.addEventListener("input", () => open(input.value));
    input.addEventListener("keydown", e => e.key === "Escape" && close());
    return box;
  }

  // A document input: uploaded at once, shown as a tag holding its name.
  function file(id, name, accept) {
    const input = h("input", {type: "file", id, accept: accept.map(a => `.${a}`).join(",")});
    const tags = h("div", {class: "tags"});
    input.addEventListener("change", () => setTimeout(() => {
      for (const f of input.files) tags.append(h("span", {class: "bp3-tag"},
        h("a", {class: "link", title: f.name}, f.name), h("input", {type: "hidden", name, value: "signed"})));
    }, 100));
    return [input, h("label", {for: id}, "Attach"), tags];
  }

  const shown = {};  // a conditional question's render, by its parent's question id
  const render = {
    "Shared::Form::Phonenumberinput": p => [h("input", {type: "tel", name: p.name, id: p.id, required: ""})],
    "Shared::Form::Address": p => {
      const names = p.fieldNames, t = p.translations, lines = h("div");
      const layout = us => lines.replaceChildren(
        h("label", {class: "external-form__label"}, us ? t.streetAddress : t.addressOne),
        h("input", {type: "text", name: names.addressOne, id: "address1"}),
        h("label", {class: "external-form__label"}, us ? t.city : t.addressTwo),
        h("input", {type: "text", name: names.addressTwo, id: "address2"}),
        h("label", {class: "external-form__label"}, us ? t.state : t.town),
        us ? select(p.stateOptions, {name: names.town, searchable: true})
           : h("input", {type: "text", name: names.town, id: "town"}),
        h("label", {class: "external-form__label"}, us ? t.zipcode : t.postcode),
        h("input", {type: "text", name: names.postcode, id: "postcode"}));
      layout(false);
      // the country starts on the visitor's, guessed by the page
      const country = select(p.countryOptions, {name: names.country, searchable: true,
        onPick: o => layout(o.value === "US"), initial: p.countryOptions[0]});
      return [h("div", {id: "address-country"}, h("label", {}, t.country), country), lines];
    },
    "Shared::Form::Filefield": p => file(p.name, p.name, p.accept),
    "External::Jobs::Equalitymonitoring::Tsselect": p => [select(p.options, {name: p.name})],
    "Shared::Form::Questions::Shorttext": p => [label(p.id, p.questionDetails),
      h("input", {type: "text", id: p.id, name: p.name})],
    "Shared::Form::Questions::Longtext": p => [label(p.id, p.questionDetails),
      h("textarea", {id: p.id, name: p.name})],
    "Shared::Form::Questions::Numberinput": p => [label(p.id, p.questionDetails),
      h("input", {type: "number", id: p.id, name: p.name})],
    "Shared::Form::Questions::Url": p => [label(p.name, p.questionDetails),
      h("input", {type: "text", id: p.name, name: p.name})],
    "Shared::Form::Questions::Boolean": p => {
      const d = p.questionDetails, name = `${prefix(d)}[boolean_answer]`;
      return [label("", d), ...[["true", p.translations.yes], ["false", p.translations.no]].map(([v, text]) => {
        const id = `answer_${d.index}_${v}`;
        const radio = h("input", {type: "radio", id, name, value: v});
        radio.addEventListener("change", () => shown[d.questionId]?.(v));
        return h("div", {}, radio, h("label", {for: id}, text));
      })];
    },
    "Shared::Form::Questions::Singleselect": p => [label("", p.questionDetails), select(p.options)],
    "Shared::Form::Questions::Multiselect": p => [label("", p.questionDetails), select(p.options, {multi: true})],
    "Shared::Form::Questions::Dateselect": p => {
      const d = p.questionDetails, name = n => `${prefix(d)}[date_answer(${n}i)]`;
      const options = (first, values) => [h("option", {value: ""}, first),
        ...values.map(v => h("option", {value: String(v)}, String(v)))];
      const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);
      const year = new Date().getFullYear();
      return [label("", d),
        h("select", {name: name(3)}, ...options("Day", range(1, 31))),
        h("select", {name: name(2)}, ...options("Month", range(1, 12))),
        h("select", {name: name(1)}, ...options("Year", range(year, year + 3)))];
    },
    "Shared::Form::Questions::Document": p => [label("", p.questionDetails),
      ...file(p.name, p.name, p.accept)],
    "Shared::Form::Questions::Multipledocuments": p => [label("", p.questionDetails),
      ...file(p.name, `${p.name}[]`, p.accept)],
  };
  for (const script of document.querySelectorAll("script.js-react-on-rails-component")) {
    const props = JSON.parse(script.textContent), make = render[script.dataset.componentName];
    const root = document.getElementById(script.dataset.domId);
    if (!make) continue;
    const parent = props.conditionalQuestionParentQuestionId;
    if (parent) {
      const wanted = props.conditionalQuestionConditions.map(c => c.value);
      shown[parent] = v => root.replaceChildren(...(wanted.includes(v) ? make(props) : []));
    } else root.replaceChildren(...make(props));
  }
})();
</script>
