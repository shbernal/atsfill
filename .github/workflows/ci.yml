name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - id: build
        run: echo "build=$(uv run python -c 'from atsfill.core.browser import BUILD; print(BUILD)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ steps.build.outputs.build }}
      - run: uv run atsfill install-browser
        env:
          GITHUB_TOKEN: ${{ github.token }}  # until daijro/camoufox#920 is released: a pinned fetch lists every repo
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest

  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2.18.0
        with:
          message: true
          branch: false
