name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - id: build
        run: echo "build=$(uv run python -c 'from atsfill.core.browser import BUILD; print(BUILD)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ steps.build.outputs.build }}
      - run: uv run atsfill install-browser
        env:
          GITHUB_TOKEN: ${{ github.token }}  # until daijro/camoufox#920 is released: a pinned fetch lists every repo
      - name: Time one browser launch, alone on the runner
        run: |
          echo "cores: $(nproc)"
          uv run python - <<'EOF'
          import tempfile, time
          from pathlib import Path
          from atsfill.core import browser
          for run in (1, 2):
              start = time.monotonic()
              with browser.open_page(Path(tempfile.mkdtemp())) as page:
                  page.goto("about:blank")
              print(f"launch {run}: {time.monotonic() - start:.1f}s")
          EOF
      - run: uv run pytest -n auto --dist loadscope --durations=20 --shard ${{ matrix.shard }}/3

  # The check the ruleset requires: green only when lint and every shard are.
  check:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-26.04
    steps:
      - run: test "${{ needs.lint.result }}" = success && test "${{ needs.test.result }}" = success

  commit-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2.18.0
        with:
          message: true
          branch: false
