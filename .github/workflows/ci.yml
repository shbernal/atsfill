name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - id: build
        run: echo "build=$(uv run python -c 'from atsfill.core.browser import BUILD; print(BUILD)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ steps.build.outputs.build }}
      - run: uv run atsfill install-browser
        env:
          GITHUB_TOKEN: ${{ github.token }}  # until daijro/camoufox#920 is released: a pinned fetch lists every repo
      - name: Time one browser launch, alone on the runner
        run: |
          echo "cores: $(nproc)"
          uv run python - <<'EOF'
          import tempfile, time
          from pathlib import Path
          from atsfill.core import browser
          for run in (1, 2):
              start = time.monotonic()
              with browser.open_page(Path(tempfile.mkdtemp())) as page:
                  page.goto("about:blank")
              print(f"launch {run}: {time.monotonic() - start:.1f}s")
          EOF
      - run: uv run pytest -n auto --dist loadscope --durations=20 --shard ${{ matrix.shard }}/3

  # Windows: the package imports and the data directory lock holds. No browser runs here.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run python -c "import atsfill.cli"
      - run: uv run pytest tests/test_browser.py -k lock

  # The docs site, built strict as the deploy builds it. The run history is PostHog's at
  # deploy; here it is written from no runs, so its page and its links exist.
  docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: echo '[]' > "$RUNNER_TEMP/runs.json"
      - run: uv run --only-group docs python scripts/run_history.py --from "$RUNNER_TEMP/runs.json"
      - run: uv run --only-group docs zensical build --clean --strict

  # The check the ruleset requires: green only when lint, every shard, Windows and the docs are.
  check:
    if: always()
    needs: [lint, test, windows, docs]
    runs-on: ubuntu-26.04
    steps:
      - run: test "${{ needs.lint.result }}" = success && test "${{ needs.test.result }}" = success && test "${{ needs.windows.result }}" = success && test "${{ needs.docs.result }}" = success

  commit-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      # The commit-check CLI pinned in uv.lock, run on each commit of a pull request, or
      # on the commit a push lands. Not commit-check-action: it looks up its own
      # attestation on GitHub's API, whose outages failed this job (#85).
      - name: Check commit messages against .github/cchk.toml
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            shas=$(git rev-list --reverse "$RANGE")
          else
            shas=$(git rev-parse HEAD)
          fi
          failed=0
          for sha in $shas; do
            git log -1 --format='%h %s' "$sha"
            git log -1 --format=%B "$sha" \
              | uv run --locked --only-group commit-check commit-check --message || failed=1
          done
          exit "$failed"
