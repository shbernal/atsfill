name: Docs

# The docs site on GitHub Pages: built from docs/ with Zensical on every push to `main`, and
# daily so the run history, queried from PostHog at build time, stays fresh without a push.
# After the deploy, the same events keep the `failure` issues in line.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"  # run history refresh, daily
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

env:
  DEPLOY_RETRY_WAIT_S: 30

jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      issues: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.redeployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the run history draws dev runs on a commit of main only
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/configure-pages@v6
      - run: uv run --only-group docs python scripts/run_history.py
        env:
          POSTHOG_READ_KEY: ${{ secrets.POSTHOG_READ_KEY }}
      - run: uv run --only-group docs zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Creating the deployment drops now and then (#294). Only a second try within the run
      # helps: a re-run of the job builds a second artifact, which deploy-pages refuses.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep "$DEPLOY_RETRY_WAIT_S"
      - id: redeployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - run: uv run --only-group docs python -m scripts.failures --sync
        env:
          POSTHOG_READ_KEY: ${{ secrets.POSTHOG_READ_KEY }}
          GH_TOKEN: ${{ github.token }}
