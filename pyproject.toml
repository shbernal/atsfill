[project]
name = "atsfill"
version = "0.0.4"
description = "Read, dry-run and submit job application forms on hiring systems: Ashby, Greenhouse, Teamtailor, Welcome to the Jungle."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shbernal" }]
requires-python = ">=3.14"
keywords = ["job-applications", "ats", "ashby", "greenhouse", "teamtailor", "ai-agents", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "camoufox==0.5.8",
    "filelock==4.1.1",
    "keyring==25.7.0",
    "packaging==26.3",
    "posthog==7.78.0",
]

[project.urls]
Homepage = "https://github.com/shbernal/atsfill"
Repository = "https://github.com/shbernal/atsfill"
Issues = "https://github.com/shbernal/atsfill/issues"

[project.scripts]
atsfill = "atsfill.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
commit-check = [
    "commit-check==2.19.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "ty==0.0.89",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
