[project]
name = "atsfill"
version = "0.0.1"
description = "CLI that reads, dry-runs and submits job application forms on hiring systems such as Ashby, Greenhouse and Teamtailor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shbernal" }]
requires-python = ">=3.14"
dependencies = [
    "camoufox==0.5.8",
]

[project.scripts]
atsfill = "atsfill.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty==0.0.89",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: drives a real hiring system page with data from .env and .tmp/; opt-in with -m live",
]
addopts = "-m 'not live'"
