# The hiring systems atsfill has mapped (ADR 0012), one table per freehire `source`.
# `docs/adapters/README.md` is generated from this file: `uv run scripts/backlog.py`.
#
# kind      ats | board | aggregator | custom
# share     fraction of freehire's postings, worldwide, from its `source` facet
# account   none | to_send | to_read
# hosting   hosted, embedded: where the form is found
# links_to  an aggregator's: the sources its postings were followed to
# adapter   the adapter's name, when there is one
# block     vendor, signal, step (posting | form | upload), date, version, camoufox, browser
# mapped, dry_run_verified, send_verified
#           date, version (the release), commit (the exact code), by; only the user sets
#           send_verified
# send_broken
#           date, version, commit, by, cause (system | code | unknown), reason: a send that
#           worked fails now; send_verified stays as the last known good

